key: metropolis
name: Metropolis Healthcare
enabled_in: [patient_registry, bill_generator, reports]

detect:
  sender_domains: [example-metropolis.com]
  text_contains_all: ["VID No.", "PID No."]
  filename_hint: '^Report-\d+_'

datetime_formats: ["%d/%m/%Y %I:%M %p", "%d/%m/%Y %I:%M%p"]   # day first; "4:11PM" has no space

header:
  patient_name:      { label: "Name" }                # "Mr. RAMESH GADA"
  age_gender:        { label: "Age / Gender" }        # "52 Year(s)/ Male"
  phone:             { label: "Contact No." }         # blank in sample; saved when present
  lab_pid:           { label: "PID No." }             # "P39326581861483"
  referred_by:       { label: "Referred by" }         # "DR.JATIN KOTHARI"
  registration_date: { label: "Registered On", type: date }
  collection_time:   { label: "Collected On",  type: datetime }
  reporting_time:    { label: "Reported On",   type: datetime }
extra_labels: ["VID No.", "Address", "Pin code"]     # read for audit only, not saved as fields

tests:
  source: investigation_column   # bold names under "Investigation"; the grey line in brackets
                                 # (specimen, method) is ignored

bill:
  mode: edit_pdf                          # the lab's own PDF; only the cells below change
  bill_no_source: lab                     # its bill number replaces bill_no (section 6.3)
  editable_cells: [test_amount, gross_total, grand_total, received_amount, payment_amount, amount_received_in_words]
  words_template: "(INR) {words} ONLY."