# Brand, timezone, currency, sessions, uploads, bill_no. Safe to edit via pull request.
brand:
  name: TrustUs Health
  logo_full: /brand/logo-full.svg     # portal UI; email PNG copy is app/core/assets/brand-logo.png
  logo_mark: /brand/logo-mark.svg
  favicon: /brand/favicon.ico
timezone: Asia/Kolkata
currency: INR
session:
  access_token_minutes: 15
  max_session_hours: 12               # hard cap, refresh never extends past this
upload:
  max_mb: 10
  allowed: [pdf, docx]
bill_no:
  digits: 6                           # 556701, 556702, ...
  start: 556701                       # first bill number; the next issued number increments from here
auth:
  otp:
    digits: 6
    expires_minutes: 5
    max_attempts: 5
    resend_cooldown_seconds: 60
    max_requests_per_hour: 5
  email:
    subject: "Your {brand} login code"
    body: |
      Your {brand} login code is {code}.
      It expires in {minutes} minutes. If you did not request it, ignore this email.
